[project]
name = "watt-wiser-research"
version = "0.1.0"
description = "NILM baseline research for the WattWiser project (whole-home disaggregation, Shelly EM Gen3)"
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "scipy==1.18.1",
    "h5py==3.16.0",
    "py7zr==1.1.3",
    "tables>=3.11.1",
    "pyarrow>=25.0.1",
    "pypdf>=6.19.0",
    "gdown>=6.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wattwiser"]
